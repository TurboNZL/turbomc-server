name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to publish the rolling "nightly" release

jobs:
  linux:
    name: Linux (.deb)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the one submodule we need
        run: git submodule update --init libraries/libnbtplusplus

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config extra-cmake-modules \
            libcmark-dev cmark libarchive-dev libqrencode-dev libtomlplusplus-dev zlib1g-dev \
            libgl-dev libvulkan-dev libxkbcommon-dev libxkbcommon-x11-0 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-xkb1 libxcb-image0 libxcb-render-util0 \
            libegl-dev libfontconfig1-dev dpkg-dev

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: 6.8.3
          modules: qtnetworkauth
          cache: true

      - name: Configure
        run: |
          # JDK 17 is needed because the bundled Java helper jars target Java 7.
          export JAVA_HOME="$JAVA_HOME_17_X64"
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR" \
            -DLauncher_QT_VERSION_MAJOR=6 \
            -DBUILD_TESTING=OFF

      - name: Build
        run: cmake --build build

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the window (Rust)
        run: |
          sudo apt-get install -y --no-install-recommends libxkbcommon-x11-dev libwayland-dev libfontconfig-dev libxcb1-dev libvulkan-dev
          cargo build --release --manifest-path ui/Cargo.toml

      - name: Package .deb
        run: |
          VERSION="0.1.0~git$(date -u +%Y%m%d).${GITHUB_SHA::7}"
          scripts/package-linux.sh build "$QT_ROOT_DIR" "$VERSION" dist ui/target/release/turbomc-ui
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: turbomc-server-linux-deb
          path: dist/*.deb

      - name: Publish rolling "nightly" release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly dist/*.deb \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly (latest main)" \
            --notes "Automatic build of the latest commit on main (${GITHUB_SHA::7}). Early development: expect rough edges. Install with: sudo apt install ./turbomc-server_*.deb"
